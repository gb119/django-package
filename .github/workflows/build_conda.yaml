
name: Conda

on:
  push

# workflow_dispatch:        # Un comment line if you also want to trigger action manually

jobs:
  conda_deployment_with_new_tag:
    name: Conda deployment of package for platform ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Conda environment creation and activation
        uses: conda-incubator/setup-miniconda@505e6394dae86d6a5c7fbb6e3fb8938e3e863830
        with:
          python-version: "3.12"
          environment-file: env.yaml
          activate-environment: build
          auto-update-conda: true
          auto-activate-base: false
          show-channel-urls: true
      - name: Ensure build tooling is available
        run: conda install -n build -y conda-build anaconda-client
      - name: Build conda package
        run: |
          OUT_DIR="$(mktemp -d -t conda-dist-XXXXXXXXXX)"
          conda run -n build conda-build . --no-anaconda-upload --output-folder "$OUT_DIR"
          PACKAGE_FILE="$(find "$OUT_DIR" -type f \( -name "*.conda" -o -name "*.tar.bz2" \) | head -n 1)"
          if [ -z "$PACKAGE_FILE" ]; then
            echo "No built conda package found in $OUT_DIR"
            exit 1
          fi
          echo "PACKAGE_FILE=$PACKAGE_FILE" >> "$GITHUB_ENV"
      - name: Upload conda package
        run: conda run -n build anaconda -t "${{ secrets.ANACONDA }}" upload --user phygbu --label main --force "$PACKAGE_FILE"
